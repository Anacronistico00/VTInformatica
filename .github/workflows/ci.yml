name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VTInformatica.sln

      - name: Build
        run: dotnet build VTInformatica.sln --no-restore -c Release

      # Nessun segreto necessario: i test usano SQLite in-memory e una chiave JWT di test.
      - name: Test
        run: dotnet test VTInformatica.sln --no-build -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
